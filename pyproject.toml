[build-system]
requires = ["setuptools>=64"]
build-backend = "setuptools.build_meta"

[project]
name = "llrwa"
version = "0.1.0"
description = "Cross-venue lead-lag of TradFi-linked crypto perpetuals (HRY estimator)"
authors = [{ name = "Gioele Pasteris" }]
requires-python = ">=3.12"

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-q"
